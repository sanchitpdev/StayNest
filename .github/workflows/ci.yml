name: CI — Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Java
        run: |
          java -version
          mvn -version

      - name: Build backend jar
        working-directory: ./staynest-backend
        run: mvn clean package -DskipTests -B

      - name: Build Docker images
        run: docker compose build

      - name: Verify Docker images
        run: |
          docker image ls | grep staynest
          echo "✅ Docker images built successfully"

      - name: Notify success
        if: success()
        run: |
          echo "✅ CI passed on branch ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ CI FAILED on branch ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Check the logs above for details"
