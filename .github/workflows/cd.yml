name: CD — Deploy to Local

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy StayNest
    runs-on: self-hosted

    defaults:
      run:
        working-directory: /home/sanchit/Projects/StayNest_All/StayNest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Java
        run: |
          java -version
          mvn -version

      - name: Build backend jar
        working-directory: /home/sanchit/Projects/StayNest_All/StayNest/staynest-backend
        run: mvn clean package -DskipTests -B

      - name: Stop running containers
        run: |
          docker compose down
          echo "✅ Old containers stopped"

      - name: Clear Docker BuildKit cache
        run: |
          docker builder prune -af
          echo "✅ BuildKit cache cleared"

      - name: Build fresh Docker images
        run: |
          docker compose build --no-cache
          echo "✅ Fresh images built"

      - name: Start containers
        run: |
          docker compose up -d
          echo "✅ Containers started"

      - name: Wait for backend health check
        run: |
          echo "Waiting for backend to start..."
          for i in {1..12}; do
            if curl -sf http://localhost:9090/api/v1/health > /dev/null 2>&1; then
              echo "✅ Backend is healthy!"
              break
            fi
            echo "Attempt $i/12 — waiting 10 seconds..."
            sleep 10
          done
          if ! curl -sf http://localhost:9090/api/v1/health > /dev/null 2>&1; then
            echo "❌ Backend failed to start after 2 minutes"
            docker compose logs backend --tail=50
            exit 1
          fi

      - name: Verify frontend
        run: |
          if curl -sf http://localhost:8088 > /dev/null 2>&1; then
            echo "✅ Frontend is accessible at http://localhost:8088"
          else
            echo "⚠️ Frontend check failed"
            docker compose logs frontend --tail=20
          fi

      - name: Show deployment status
        run: |
          echo "======= DEPLOYMENT STATUS ======="
          docker compose ps
          echo "================================="

      - name: Clean up old images
        run: |
          docker image prune -f
          echo "✅ Old images cleaned up"

      - name: Deployment success notification
        if: success()
        run: |
          echo "🚀 DEPLOYMENT SUCCESSFUL!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Time: $(date)"
          echo "App running at: http://localhost:8088"
          echo "API running at: http://localhost:9090/api/v1"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ DEPLOYMENT FAILED!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          docker compose down || true
          echo "Containers stopped. Manual intervention required."
