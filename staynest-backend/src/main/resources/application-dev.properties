# ===============================
# DEVELOPMENT ENVIRONMENT
# ===============================

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/staynestdb
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (shorter expiration for dev)
jwt.expiration-ms=86400000

# Logging (verbose for dev)
logging.level.com.staynest=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# CORS (allow all local origins)
cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8081

# Swagger enabled
springdoc.swagger-ui.enabled=true

# Error messages (show full details in dev)
server.error.include-stacktrace=always
