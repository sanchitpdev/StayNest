# ===============================
# PRODUCTION ENVIRONMENT
# ===============================

# Database (use environment variables in production)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# Logging
logging.level.com.staynest=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# CORS (specify exact production URLs)
cors.allowed-origins=${ALLOWED_ORIGINS}

# Swagger (disable in production for security)
springdoc.swagger-ui.enabled=false

# Error messages (hide stack traces in prod)
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never

# SSL/HTTPS
server.ssl.enabled=false

# Connection pool (larger for production)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10