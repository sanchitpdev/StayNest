# ========================Database =======================================
spring.datasource.url=jdbc:postgresql://postgres:5432/staynestdb
spring.datasource.username=postgres
spring.datasource.password=1234

# ======================== JPA =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ================== JWT =========================================
jwt.secret=49485af85b0e6e215d729bffff25eadd6eeec789c2df5675a3a01052003b6f75
jwt.expiration-ms=86400000
jwt.issuer=StayNest

# ===== Logging ===========================================
logging.level.root=WARN
logging.level.com.staynest=INFO
logging.file.name=/app/logs/staynest.log

# ============= CORS =====================================
cors.allowed-origins=http://localhost,http://localhost:80

# ================== Swagger =============================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api-docs